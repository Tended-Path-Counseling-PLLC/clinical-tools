<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake Note Generator — Tended Path Counseling</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171921;
    --surface: #242733;
    --surface-2: #2c303f;
    --field: #1c1e28;
    --field-focus: #20232f;
    --text: #ede8e1;
    --muted: #a9a3b1;
    --border: #3e4357;
    --border-soft: #313546;
    --accent: #d79f55;
    --accent-text: #e6b36c;
    --on-accent: #242733;
    --soft: rgba(215, 159, 85, 0.12);
    --soft-border: rgba(215, 159, 85, 0.45);
    --seg-on-bg: #ede8e1;
    --seg-on-text: #242733;
    --header-bg: #0f1016;
    --header-text: #f7f4f0;
    --eyebrow: #f0ddb8;
    --placeholder: #8c8696;
    --warn: #b2482a;
    --warn-text: #f2a58a;
    --ok-text: #8fd1a0;
    --shadow: rgba(0, 0, 0, .5);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --hh: 64px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ede8e1;
    --surface: #ffffff;
    --surface-2: #f7f4f0;
    --field: #f7f4f0;
    --field-focus: #fffdf9;
    --text: #242733;
    --muted: #6a646e;
    --border: #d6d0c8;
    --border-soft: #ede8e1;
    --accent: #d79f55;
    --accent-text: #7a5518;
    --on-accent: #242733;
    --soft: #fdf5ea;
    --soft-border: #e8c88a;
    --seg-on-bg: #242733;
    --seg-on-text: #f7f4f0;
    --header-bg: #242733;
    --header-text: #f7f4f0;
    --eyebrow: #f0ddb8;
    --placeholder: #8f8993;
    --warn: #8f3d22;
    --warn-text: #8f3d22;
    --ok-text: #3d6b4a;
    --shadow: rgba(36, 39, 51, .18);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--text); background: var(--bg); }
  .skip { position: absolute; left: -999px; top: 0; background: var(--surface); color: var(--text); padding: 8px 12px; z-index: 100; }
  .skip:focus { left: 8px; top: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header.top { position: sticky; top: 0; z-index: 30; height: var(--hh); background: var(--header-bg); color: var(--header-text); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; }
  header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent), transparent 60%); }
  .eyebrow { font-family: var(--serif); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--eyebrow); }
  header.top h1 { font-family: var(--serif); font-weight: 400; font-size: 25px; margin: 0; line-height: 1.1; }
  .top-actions { display: flex; align-items: center; gap: 12px; }
  .priv { font-size: 13px; color: #b9b3c0; }

  /* Layout */
  .app { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(400px, 0.95fr); max-width: 1760px; margin: 0 auto; align-items: start; }
  nav#nav { position: sticky; top: var(--hh); height: calc(100vh - var(--hh)); overflow: auto; padding: 18px 8px 24px 16px; }
  .nav-label { font-family: var(--serif); font-style: italic; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: var(--muted); margin: 0 0 8px 8px; }
  .nav-link { display: flex; align-items: center; gap: 8px; padding: 7px 8px; color: var(--text); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; border-radius: 1px; }
  .nav-link:hover { background: var(--surface); }
  .nav-link.active { background: var(--surface); border-left-color: var(--accent); font-weight: 500; }
  .nav-link .nn { font-family: var(--serif); font-style: italic; color: var(--muted); min-width: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; flex: none; margin-left: auto; }
  .dot.on { background: var(--accent); border-color: var(--accent); }
  main#form { padding: 22px 16px 60px; min-width: 0; }

  /* Cards */
  .card { --accent-card: var(--ac-dark, #6fa8c8); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-card); margin: 0 0 20px; scroll-margin-top: calc(var(--hh) + 14px); }
  :root[data-theme="light"] .card { --accent-card: var(--ac-light, #3a6b8a); }
  .card-head { display: flex; align-items: baseline; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .card-head .num { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--accent-card); }
  .card-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .card-head .grow { flex: 1; }
  .card-body { padding: 16px 18px 6px; }

  .fld { margin: 0 0 15px; min-width: 0; }
  .lab { display: block; font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .lab .opt { text-transform: none; letter-spacing: 0; font-weight: 400; font-style: italic; }
  .hint { font-size: 13px; color: var(--muted); font-style: italic; margin: 0 0 12px; }
  h3.sub { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 8px 0 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .row > .fld { margin-bottom: 15px; }

  input.inp, textarea.inp, select.inp { width: 100%; font: inherit; font-size: 15px; font-weight: 400; color: var(--text); background: var(--field); border: 1px solid var(--border); border-radius: 1px; padding: 8px 10px; }
  textarea.inp { line-height: 1.55; resize: vertical; min-height: 48px; }
  input.inp:focus, textarea.inp:focus, select.inp:focus { border-color: var(--accent); background: var(--field-focus); outline: 1px solid var(--accent); }
  ::placeholder { color: var(--placeholder); font-style: italic; opacity: 1; }
  .static { padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); }
  output.readout { display: block; padding: 8px 10px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--border); }

  /* Segmented single-select */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg-btn { font: inherit; font-size: 14px; padding: 6px 13px; background: var(--field); border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 1px; }
  .seg-btn:hover { border-color: var(--accent); }
  .seg-btn[aria-checked="true"] { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: var(--seg-on-text); font-weight: 500; }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; padding: 5px 13px; border: 1px solid var(--border); border-radius: 20px; background: var(--field); font-size: 14px; cursor: pointer; user-select: none; }
  .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--soft); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Symptom + MSE group blocks */
  .grp { border: 1px solid var(--border); background: var(--surface-2); padding: 12px 14px 4px; margin: 0 0 12px; }
  .grp > .lab { color: var(--text); font-weight: 600; }
  .grp .fld.notes { margin-top: 10px; }
  .risk-box { background: var(--soft); border: 1px solid var(--soft-border); padding: 14px 16px 4px; margin: 0 0 14px; }
  .risk-box > .lab { color: var(--accent-text); font-weight: 600; }
  .sub-card { border: 1px dashed var(--accent); background: var(--soft); padding: 10px 12px 2px; margin: 0 0 12px; }
  .sub-card h4 { margin: 0 0 8px; font-family: var(--serif); font-size: 17px; }

  /* Diagnosis picker */
  .dx { position: relative; }
  .dx-bar { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .dx-search { position: relative; flex: 1 1 320px; }
  ul.dx-list { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 0; list-style: none; background: var(--surface-2); border: 1px solid var(--accent); max-height: 280px; overflow: auto; box-shadow: 0 8px 24px var(--shadow); }
  ul.dx-list li { padding: 7px 10px; cursor: pointer; display: flex; gap: 10px; border-bottom: 1px solid var(--border-soft); }
  ul.dx-list li .c { font-weight: 600; min-width: 62px; color: var(--accent-text); }
  ul.dx-list li[aria-selected="true"], ul.dx-list li:hover { background: var(--soft); }
  .dx-empty { padding: 8px 10px; color: var(--muted); font-style: italic; }
  .dx-rows { margin-top: 12px; }
  .dx-row { display: grid; grid-template-columns: 26px 96px minmax(0, 1fr); gap: 8px; align-items: start; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft); }
  .dx-row .ord { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--muted); text-align: center; padding-top: 6px; }
  .dx-row .r2 { grid-column: 2 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 130px auto; gap: 8px; align-items: center; }
  .dx-row textarea.inp { min-height: 0; resize: none; }
  .dx-row .ibtn { display: flex; gap: 4px; }

  /* Buttons */
  .btn { font: inherit; font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; padding: 9px 18px; border-radius: 1px; cursor: pointer; border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: #e6b36c; }
  .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent-text); }
  .btn-ghost { background: transparent; border-color: #5b5e6e; color: var(--header-text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--eyebrow); }
  .btn-ghost.arm, .btn-outline.arm { background: var(--warn); border-color: var(--warn); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .icon-btn { font: inherit; width: 30px; height: 32px; background: var(--field); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
  .icon-btn:hover:not(:disabled) { border-color: var(--accent); }
  .icon-btn:disabled { opacity: .4; cursor: default; }

  /* Output */
  aside#out { position: sticky; top: var(--hh); height: calc(100vh - var(--hh)); overflow: auto; padding: 18px 16px 20px; border-left: 1px solid var(--border); background: var(--surface-2); display: flex; flex-direction: column; gap: 12px; }
  aside#out > * { flex: none; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab { font: inherit; font-family: var(--serif); font-size: 19px; padding: 6px 18px 8px; background: transparent; border: none; border-bottom: 3px solid transparent; cursor: pointer; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .out-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #copied { font-size: 14px; color: var(--ok-text); font-style: italic; min-height: 1.4em; }
  #copied.bad { color: var(--warn-text); }
  .preview { background: var(--surface); border: 1px solid var(--border); padding: 18px 20px; min-height: 360px; font-size: 15px; line-height: 1.6; }
  .preview p { margin: 0 0 .75em; }
  .preview .empty { color: var(--muted); font-style: italic; }
  .ph { color: var(--accent-text); background: var(--soft); border-bottom: 1px dashed var(--accent); }
  .flags { font-size: 14px; border: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }
  .flags h3 { font-family: var(--serif); font-size: 18px; margin: 0 0 6px; }
  .flags ul { margin: 0 0 8px; padding-left: 18px; }
  .flags li { margin-bottom: 4px; }
  .flags li.warn { color: var(--warn-text); }
  .flags .remind { color: var(--muted); font-style: italic; margin: 6px 0 0; }
  .copy-stage { position: fixed; left: -9999px; top: 0; width: 700px; background: #fff; color: #000; font: 14px/1.5 Arial, sans-serif; }

  footer.foot { background: var(--header-bg); color: #b9b3c0; font-size: 13px; padding: 12px 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .is-hidden { display: none !important; }

  /* Narrow screens */
  @media (max-width: 1240px) {
    .app { grid-template-columns: 180px minmax(0, 1fr); }
    aside#out { grid-column: 1 / -1; position: static; height: auto; border-left: none; border-top: 3px solid var(--accent); }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    nav#nav { position: sticky; top: var(--hh); height: auto; z-index: 15; display: flex; gap: 4px; overflow-x: auto; padding: 6px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .nav-label { display: none; }
    .nav-link { white-space: nowrap; }
    .nav-link .dot { margin-left: 4px; }
    .priv { display: none; }
    .dx-row { grid-template-columns: 90px minmax(0, 1fr); }
    .dx-row .ord { display: none; }
    .dx-row .r2 { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) 120px; }
    .dx-row .ibtn { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<a class="skip" href="#form">Skip to form</a>

<header class="top">
  <div>
    <div class="eyebrow">Tended Path Counseling, PLLC</div>
    <h1>Intake Note Generator</h1>
  </div>
  <div class="top-actions">
    <span class="priv">Nothing is saved or sent. Closing this tab clears everything.</span>
    <button type="button" id="themeBtn" class="btn btn-ghost" aria-pressed="true">Light mode</button>
    <button type="button" id="clearAll" class="btn btn-ghost">Clear all</button>
  </div>
</header>

<div class="app">
  <nav id="nav" aria-label="Form sections"></nav>
  <main id="form" aria-label="Intake form"></main>
  <aside id="out" aria-label="Generated note">
    <div class="tabs" role="tablist" aria-label="Output">
      <button type="button" class="tab" role="tab" id="tab-intake" aria-selected="true" aria-controls="preview">Intake note</button>
      <button type="button" class="tab" role="tab" id="tab-pirp" aria-selected="false" aria-controls="preview">PIRP note</button>
    </div>
    <div class="out-actions">
      <button type="button" id="copyRich" class="btn btn-primary">Copy note</button>
      <button type="button" id="copyPlain" class="btn btn-outline">Copy plain text</button>
      <span id="copied" role="status" aria-live="polite"></span>
    </div>
    <div id="preview" class="preview" role="tabpanel" tabindex="0"></div>
    <div id="flags" class="flags"></div>
  </aside>
</div>

<footer class="foot">
  <span>Tended Path Counseling, PLLC — Bethany Sherman, LMHC #LH70011579</span>
  <span>No data is stored, saved, or transmitted. Fonts fall back to system fonts.</span>
</footer>

<script>
(function () {
'use strict';

/* ───────────────────────── Small helpers ───────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escBr = s => esc(s).replace(/\n/g, '<br>');
const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lcFirst = s => (s && !/^[A-Z]{2,}/.test(s) && !/^I\b/.test(s)) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const endP = s => { s = (s || '').trim(); return s && !/[.!?]["')\]]?$/.test(s) ? s + '.' : s; };
const joinList = a => a.length <= 1 ? (a[0] || '') : a.length === 2 ? a[0] + ' and ' + a[1] : a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
function pad(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDate(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[2] + '/' + m[3] + '/' + m[1] : ''; }
function fmt12(v) { const m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); if (!m) return ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap; }
function mins(v) { const m = /^(\d{1,2}):(\d{2})$/.exec(v || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }

/* ───────────────────────── State reader (reads the DOM) ───────────────────────── */
const S = {
  el(id) { return document.querySelector('[data-fid="' + id + '"]'); },
  hidden(e) { return !e || !!e.closest('.is-hidden'); },
  t(id) { const e = this.el(id); if (this.hidden(e)) return ''; const i = e.querySelector('input,textarea,select'); return i ? i.value.trim() : ''; },
  seg(id) { const e = this.el(id); if (this.hidden(e)) return ''; const b = e.querySelector('button[aria-checked="true"]'); return b ? b.dataset.val : ''; },
  chips(id) { const e = this.el(id); if (this.hidden(e)) return []; return [...e.querySelectorAll('input:checked')].map(i => i.value); },
  has(id, v) { return this.chips(id).includes(v); }
};

/* ───────────────────────── Data ───────────────────────── */
const YN = ['Yes', 'No'];
const POS_CODE = { 'In-Person, Office': '11', 'Telehealth, Video, Home': '10', 'Telehealth, Video, Not Home': '02' };
const ACCENTS = ['#3a6b8a', '#5c7a52', '#7a5c7a', '#8a6040', '#3d6b6b', '#6b5a3a', '#4a5e7a', '#7a4a5a'];
const ACCENTS_DARK = ['#6fa8c8', '#8fb383', '#b58fb5', '#c99468', '#6fb3b3', '#c4a86a', '#8aa3c8', '#c98a9f'];

const SUBSTANCES = ['Alcohol', 'Amphetamines/stimulants', 'Cannabis', 'Cocaine/crack', 'Hallucinogens', 'Heroin', 'Inhalant', 'Methadone', 'Nicotine', 'Opiates', 'OTC', 'Phencyclidine (PCP)', 'Prescription', 'Gambling', 'Sexual', 'Sedative/hypnotic', 'Other'];
const SUB_PHRASE = { 'Alcohol': 'alcohol', 'Amphetamines/stimulants': 'amphetamines/stimulants', 'Cannabis': 'cannabis', 'Cocaine/crack': 'cocaine/crack', 'Hallucinogens': 'hallucinogens', 'Heroin': 'heroin', 'Inhalant': 'inhalants', 'Methadone': 'methadone', 'Nicotine': 'nicotine', 'Opiates': 'opiates', 'OTC': 'over-the-counter medication', 'Phencyclidine (PCP)': 'phencyclidine (PCP)', 'Prescription': 'prescription medication', 'Gambling': 'gambling', 'Sexual': 'sexual behavior', 'Sedative/hypnotic': 'sedative/hypnotics' };

const MSE = [
  { id: 'mApp', label: 'Appearance', opts: ['Well-groomed', 'Appropriately dressed', 'Casually dressed', 'Disheveled', 'Poor hygiene', 'Notable (see narrative)'] },
  { id: 'mBeh', label: 'Behavior / psychomotor', opts: ['Calm', 'Cooperative', 'Engaged', 'Good eye contact', 'Limited eye contact', 'Guarded', 'Restless', 'Agitated', 'Psychomotor slowing'] },
  { id: 'mSpe', label: 'Speech', opts: ['Normal rate, rhythm, and volume', 'Pressured', 'Slowed', 'Soft', 'Loud'] },
  { id: 'mMood', label: 'Mood (client-reported)', opts: ['Good', 'Neutral', 'Anxious', 'Sad / low', 'Stressed / overwhelmed', 'Irritable', 'Mixed'], quote: true },
  { id: 'mAff', label: 'Affect (observed)', opts: ['Full range', 'Congruent with mood', 'Constricted', 'Blunted', 'Flat', 'Labile', 'Anxious', 'Dysphoric', 'Elevated', 'Irritable', 'Tearful'] },
  { id: 'mTP', label: 'Thought process', opts: ['Linear and goal-directed', 'Circumstantial', 'Tangential', 'Ruminative', 'Racing', 'Disorganized'] },
  { id: 'mTC', label: 'Thought content', opts: [{ v: 'No delusions or paranoia noted', x: 1 }, 'Worry-focused', 'Ruminative', 'Obsessional content', 'Paranoid ideation', 'Delusional content'] },
  { id: 'mPerc', label: 'Perception', opts: [{ v: 'No perceptual disturbances noted', x: 1 }, 'Auditory hallucinations', 'Visual hallucinations', 'Other perceptual disturbance'] },
  { id: 'mCog', label: 'Cognition / orientation', opts: ['Alert', 'Oriented x4', 'Mild cognitive fog', 'Memory concerns', 'Concentration impaired'] },
  { id: 'mIns', label: 'Insight', single: ['Good', 'Fair', 'Limited', 'Poor'] },
  { id: 'mJud', label: 'Judgment', single: ['Good', 'Fair', 'Limited', 'Poor'] }
];

const DX_LIST = [
  ['F32.0', 'Major depressive disorder, single episode, mild', 'mdd depression depressive'],
  ['F32.1', 'Major depressive disorder, single episode, moderate', 'mdd depression depressive'],
  ['F32.2', 'Major depressive disorder, single episode, severe', 'mdd depression depressive'],
  ['F33.0', 'Major depressive disorder, recurrent, mild', 'mdd depression depressive recurrent'],
  ['F33.1', 'Major depressive disorder, recurrent, moderate', 'mdd depression depressive recurrent'],
  ['F33.2', 'Major depressive disorder, recurrent, severe', 'mdd depression depressive recurrent'],
  ['F34.1', 'Persistent depressive disorder (dysthymia)', 'pdd dysthymia depression'],
  ['F41.1', 'Generalized anxiety disorder', 'gad anxiety worry'],

/* Diagnosis picker */
let dxRows = [];
let dxRowsEl = null;
function renderDx(w) {
  const box = el('div', 'dx');
  const bar = el('div', 'dx-bar');
  const wrap = el('div', 'dx-search');
  const search = document.createElement('input');
  search.type = 'text'; search.className = 'inp'; search.id = 'dxSearch'; search.autocomplete = 'off';
  search.placeholder = 'Search by name, code, or abbreviation (GAD, F41.1, adjustment…)';
  search.setAttribute('role', 'combobox'); search.setAttribute('aria-expanded', 'false'); search.setAttribute('aria-controls', 'dxList'); search.setAttribute('aria-label', 'Search diagnoses');
  const list = el('ul', 'dx-list'); list.id = 'dxList'; list.setAttribute('role', 'listbox'); list.hidden = true;
  wrap.append(search, list);
  const custom = el('button', 'btn btn-outline'); custom.type = 'button'; custom.textContent = 'Add custom diagnosis';
  bar.append(wrap, custom);
  dxRowsEl = el('div', 'dx-rows');
  box.append(bar, dxRowsEl);
  w.append(box);

  let active = -1, shown = [];
  function fill() {
    const q = search.value.trim().toLowerCase();
    shown = DX_LIST.filter(d => !q || (d[0] + ' ' + d[1] + ' ' + d[2]).toLowerCase().includes(q)).slice(0, 14);
    list.innerHTML = '';
    if (!shown.length) { const li = el('li', 'dx-empty', 'No match. Use "Add custom diagnosis" for anything not on the list.'); list.append(li); }
    shown.forEach((d, i) => {
      const li = el('li'); li.setAttribute('role', 'option'); li.id = 'dxo' + i; li.setAttribute('aria-selected', i === active ? 'true' : 'false');
      li.append(el('span', 'c', d[0] || '—'), el('span', null, d[1]));
      li.addEventListener('mousedown', e => { e.preventDefault(); pick(d); });
      list.append(li);
    });
    list.hidden = false; search.setAttribute('aria-expanded', 'true');
  }
  function close() { list.hidden = true; search.setAttribute('aria-expanded', 'false'); active = -1; }
  function pick(d) { addDx({ code: d[0], name: d[1], spec: '', status: dxRows.length ? 'Additional' : 'Principal' }); search.value = ''; close(); }
  search.addEventListener('focus', fill);
  search.addEventListener('input', () => { active = -1; fill(); });
  search.addEventListener('blur', () => setTimeout(close, 120));
  search.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) fill(); active = Math.min(active + 1, shown.length - 1); fill(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); fill(); }
    else if (e.key === 'Enter') { if (!list.hidden && shown[active]) { e.preventDefault(); pick(shown[active]); } else if (!list.hidden && shown.length === 1) { e.preventDefault(); pick(shown[0]); } }
    else if (e.key === 'Escape') { close(); }
  });
  custom.addEventListener('click', () => { addDx({ code: '', name: '', spec: '', status: dxRows.length ? 'Additional' : 'Principal' }, true); });
  renderDxRows();
}
function addDx(row, focus) { dxRows.push(row); renderDxRows(focus ? dxRows.length - 1 : -1); update(); }
function dxReset() { dxRows = []; renderDxRows(); }
function renderDxRows(focusIdx) {
  if (!dxRowsEl) return;
  dxRowsEl.innerHTML = '';
  if (!dxRows.length) { dxRowsEl.append(el('p', 'hint', 'No diagnosis added yet.')); return; }
  dxRows.forEach((r, i) => {
    const row = el('div', 'dx-row');
    const ord = el('span', 'ord', String(i + 1));
    const code = mkInput(r.code, 'Code', v => { r.code = v; }); code.setAttribute('aria-label', 'ICD-10-CM code');
    const name = mkInput(r.name, 'Diagnosis name', v => { r.name = v; }, true); name.setAttribute('aria-label', 'Diagnosis name');
    const spec = mkInput(r.spec, 'Specifier / notes', v => { r.spec = v; }); spec.setAttribute('aria-label', 'Specifier or notes');
    const st = document.createElement('select'); st.className = 'inp'; st.setAttribute('aria-label', 'Diagnosis status');
    ['Principal', 'Additional', 'Provisional', 'Rule out'].forEach(o => { const op = el('option', null, o); op.value = o; st.append(op); });
    st.value = r.status; st.addEventListener('change', () => { r.status = st.value; update(); });
    const btns = el('div', 'ibtn');

function mkChips(f, labEl) {

function third(b) {

function symptomNarrative() {
  const out = []; let vi = 0;
  const say = ph => { const w = who(out.length === 0); out.push(w.subj + ' ' + w.v(VERBS[vi++ % VERBS.length]) + ' ' + ph + '.'); };
  const note = id => { const n = S.t(id); if (n) out.push(endP(capFirst(n))); };

  let a = S.chips('sSleep');
  if (a.includes('Within normal limits')) out.push('Sleep is within normal limits.');
  else {
    const ph = []; if (a.includes('Hypersomnia')) ph.push('hypersomnia');
    const ins = []; if (a.includes('Insomnia - onset')) ins.push('sleep onset'); if (a.includes('Insomnia - maintenance')) ins.push('sleep maintenance'); if (a.includes('Insomnia - late')) ins.push('early morning waking');
    if (ins.length) ph.push('insomnia affecting ' + joinList(ins));
    if (ph.length) say(joinList(ph));
  }
  note('sSleepN');

  a = S.chips('sApp');
  if (a.includes('Within normal limits')) out.push('Appetite and eating patterns are within normal limits.');
  else {
    const ph = []; if (a.includes('Decreased appetite')) ph.push('decreased appetite'); if (a.includes('Increased appetite')) ph.push('increased appetite'); if (a.includes('Irregular / restricted')) ph.push('irregular or restricted eating patterns');
    if (ph.length) say(joinList(ph));
  }
  note('sAppN');

  a = S.chips('sAtt');
  if (a.includes('Within normal limits')) out.push('Memory and attention are within normal limits.');
  else {
    const map = { 'Deficits': 'memory or attention deficits', 'Easily distracted': 'easy distractibility', 'Hyperactive': 'hyperactivity', 'Poor concentration': 'poor concentration', 'Overly attentive': 'overattentiveness' };
    const ph = a.map(x => map[x]).filter(Boolean); if (ph.length) say(joinList(ph));
  }
  note('sAttN');

  a = S.chips('sTho');
  if (a.includes('None reported')) out.push('No delusions, hallucinations, paranoid ideation, obsessions, compulsions, or disorganized thinking were reported.');
  else if (a.length) out.push('Thought content and perception are notable for ' + joinList(a.map(x => x.toLowerCase())) + '.');
  note('sThoN');

  a = S.chips('sMood');
  if (a.includes('None reported')) { const w = who(out.length === 0); out.push(w.subj + ' ' + w.v('deny') + ' significant mood symptoms.'); }
  else {
    const map = { 'Depressed': 'depressed mood', 'Helpless / hopeless': 'feelings of helplessness and hopelessness', 'Worthless': 'feelings of worthlessness', 'Anxious': 'anxiety', 'Panic attacks': 'panic attacks', 'Excessive worry': 'excessive worry', 'Irritable': 'irritability', 'Tearful': 'tearfulness' };
    const ph = a.map(x => map[x]).filter(Boolean); if (ph.length) say(joinList(ph));
  }
  note('sMoodN');
  return out.join(' ');
}

function substanceNarrative() {
  const sel = S.chips('subst'); if (!sel.length) return '';
  if (sel.includes('No history of substance use')) { const w = who(true); return w.subj + ' ' + w.v('deny') + ' any history of substance use or addictive behavior.'; }
  const nm = x => x === 'Other' ? (S.t('sb_other_name') || 'other substance or behavior') : SUB_PHRASE[x];
  const w = who(true);
  const lines = [w.subj + ' ' + w.v('report') + ' a history of use or involvement with ' + joinList(sel.map(nm)) + '.'];
  sel.forEach(x => {
    const k = 'sb_' + slug(x), parts = [];
    [['amount', 'amount'], ['route', 'route'], ['dur', 'duration'], ['last', 'last use'], ['tx', 'treatment history']].forEach(([id, lab]) => { const v = S.t(k + '_' + id); if (v) parts.push(lab + ' ' + v); });

function traumaNarrative() {

  if (sel.includes('None reported')) return 'No history of trauma was reported.' + (S.t('traumaN') ? ' ' + endP(capFirst(S.t('traumaN'))) : '');
  const cats = [];
  if (sel.includes('Physical')) cats.push('physical trauma'); if (sel.includes('Sexual')) cats.push('sexual trauma'); if (sel.includes('Emotional')) cats.push('emotional trauma'); if (sel.includes('Neglect')) cats.push('neglect'); if (sel.includes('Other')) cats.push('other trauma');
  const parts = [];
  if (cats.length) { const w = who(true); parts.push(w.subj + ' ' + w.v('report') + ' a history of ' + joinList(cats) + '.'); }
  if (sel.includes('Not ready to discuss')) { const w = who(!cats.length); parts.push(cats.length ? capFirst(w.subj) + ' ' + (PR.set && PR.pl ? 'are' : 'is') + ' not ready to discuss it further at this time.' : 'Client is not ready to discuss trauma history at this time.'); }

}

const AREA_KEYS = ['consent', 'telehealth', 'concerns', 'psych', 'medical', 'substance', 'social', 'trauma', 'mse', 'dx', 'plan', 'coord', 'referral', 'safety'];
function riskOn() { return S.chips('pirpOpts').length > 0; }
function anyT(ids) { return ids.some(i => S.t(i)); }
function autoArea(k) {
  switch (k) {
    case 'consent': return S.seg('consent') === 'Yes';
    case 'telehealth': return false;
    case 'concerns': return anyT(['primary', 'onset', 'duration', 'stressors', 'pcSummary']);
    case 'psych': return ['priorTherapy', 'priorPsych', 'medication', 'hosp', 'priorDx'].some(i => S.seg(i)) || !!S.t('famPsych');
    case 'medical': return anyT(['medConditions', 'pcp']) || ['sSleep', 'sApp', 'sAtt', 'sTho', 'sMood'].some(i => S.chips(i).length);
    case 'substance': return S.chips('subst').length > 0;
    case 'social': return anyT(['famOrigin', 'living', 'edu', 'support', 'cultural']) || !!S.seg('relStatus') || !!S.seg('emp') || !!S.seg('legal');
    case 'trauma': return S.chips('trauma').length > 0;
    case 'mse': return MSE.some(m => m.single ? !!S.seg(m.id) : S.chips(m.id).length) || !!S.t('mseNarr');
    case 'dx': return dxRows.some(r => (r.code + r.name).trim()) || !!S.t('formulation');
    case 'plan': return anyT(['txGoals', 'freq', 'dur']);
    case 'coord': return S.chips('coord').some(x => x !== 'None');
    case 'referral': return S.seg('refInd') === 'Yes';
    case 'safety': return riskOn() && S.seg('sihi') === 'Yes';
  }
  return false;
}
function syncAreas() {
  const e = S.el('pirpAreas'); if (!e) return;
  e.querySelectorAll('input').forEach(i => { if (!i.dataset.manual) i.checked = autoArea(i.value); });
  syncChips(e.querySelector('.chips'));
}

const PH_LIST = [];
const PH = t => { PH_LIST.push(t); return '[' + t + ']'; };

function buildPIRP() {
  PH_LIST.length = 0;
  const areas = S.chips('pirpAreas');
  const secs = []; let it = [];

  K(it, 'Date', fmtDate(S.t('dos')) || PH('date of service'));
  const d = calcDur();
  const st = fmt12(S.t('tStart')), en = fmt12(S.t('tEnd'));
  K(it, 'Time', st && en ? st + '–' + en + ' (' + d + ' min)' : PH('start and end time'));
  K(it, 'CPT Code', '90791 (Intake/Diagnostic Evaluation)');
  K(it, 'POS', posText(S.seg('posClient')) || PH('client POS'));
  K(it, 'Provider location', S.seg('posProv') || PH('provider location'));
  const dl = dxLines();
  K(it, 'Diagnosis', dl.main.length ? dl.main.join('; ') : PH('add diagnosis'));
  if (isLate()) K(it, 'Late entry', 'Note written ' + fmtDate(todayISO()));
  secs.push({ title: 'SESSION DETAIL:', items: it.map(x => Object.assign(x, { own: false })) });

  // Presenting problem
  const pp = ['Client presented for an initial diagnostic evaluation.'];
  [['Primary concern', 'primary'], ['Onset', 'onset'], ['Duration', 'duration'], ['Precipitating stressors and life context', 'stressors']].forEach(([l, id]) => { if (S.t(id)) pp.push(l + ': ' + endP(S.t(id))); });
  if (S.t('pcSummary')) pp.push(endP(S.t('pcSummary')));
  if (S.t('goals')) pp.push('Goals in ' + (PR.set ? PR.p : "the client's") + ' own words: ' + endP(S.t('goals')));
  if (riskOn()) {
    const r = []; if (S.seg('si')) r.push('suicidal ideation ' + S.seg('si').toLowerCase()); if (S.seg('hi')) r.push('homicidal ideation ' + S.seg('hi').toLowerCase()); if (S.seg('nssi')) r.push('self-harm ' + S.seg('nssi').toLowerCase());
    if (r.length) pp.push('Safety/Risk (this session): ' + joinList(r) + ', as documented in the risk assessment.');
  }
  secs.push({ title: 'PRESENTING PROBLEM:', items: [{ v: pp.join(' '), own: true }] });

  // Intervention
  const lines = [];
  const tele = /^Telehealth/.test(S.seg('posClient'));
  const listIf = (arr, pre) => { const a = arr.filter(Boolean); return a.length ? pre + joinList(a) : ''; };
  areas.forEach(k => {
    switch (k) {
      case 'consent': lines.push('Therapist reviewed informed consent and practice policies with the client.'); break;
      case 'telehealth': lines.push('Therapist reviewed telehealth informed consent with the client.'); break;
      case 'concerns': lines.push('Therapist explored presenting concerns' + listIf([S.t('onset') && 'onset', S.t('duration') && 'duration', S.t('stressors') && 'precipitating stressors'], ', including ') + '.'); break;
      case 'psych': lines.push('Therapist reviewed psychiatric and treatment history' + listIf([S.seg('priorTherapy') && 'prior therapy', S.seg('priorPsych') && 'psychiatric care', S.seg('medication') && 'medication', S.seg('hosp') && 'hospitalizations', S.seg('priorDx') && 'prior diagnoses'], ', including ') + '.'); break;
      case 'medical': lines.push('Therapist reviewed relevant medical history and current symptoms' + listIf([S.chips('sSleep').length && 'sleep', S.chips('sApp').length && 'appetite', S.chips('sAtt').length && 'memory and attention', S.chips('sTho').length && 'thought content and perception', S.chips('sMood').length && 'mood'], ', including ') + '.'); break;
      case 'substance': lines.push('Therapist assessed substance use and addictive behavior history.'); break;
      case 'social': lines.push('Therapist gathered developmental and social history' + listIf([S.t('famOrigin') && 'family of origin', S.t('living') && 'living situation', S.seg('relStatus') && 'relationship status', S.t('edu') && 'education', S.seg('emp') && 'employment', S.seg('legal') && 'legal history', S.t('support') && 'support system', S.t('cultural') && 'cultural, spiritual, and identity context'], ', including ') + '.'); break;
      case 'trauma': lines.push(S.has('trauma', 'Not ready to discuss') ? 'Therapist inquired about trauma history; the client was not ready to discuss it at this time.' : 'Therapist inquired about trauma history as disclosed by the client.'); break;
      case 'mse': lines.push('Therapist completed a mental status examination.'); break;
      case 'dx': lines.push('Therapist completed a diagnostic evaluation and clinical formulation.'); break;
      case 'plan': lines.push('Therapist established initial treatment goals and plan.'); break;
      case 'coord': lines.push('Therapist identified coordination of care needs (' + S.chips('coord').filter(x => x !== 'None').map(lcFirst).join(', ') + ').'); break;
      case 'referral': lines.push('Therapist identified a referral need.'); break;
      case 'safety': if (riskOn()) { lines.push('Therapist reviewed suicidal and homicidal ideation with the client.'); if (S.seg('safetyPlan') === 'Developed, on file') lines.push('Therapist developed a safety plan with the client; plan is on file.'); } break;
    }
  });
  if (S.t('pirpExtra')) S.t('pirpExtra').split('\n').filter(x => x.trim()).forEach(x => lines.push(endP(x)));
  if (!lines.length) lines.push(PH('select interventions or fill intake sections'));
  secs.push({ title: 'INTERVENTION:', items: lines.map(v => ({ v, own: false })) });

  // Response
  const resp = S.t('pirpResp');
  secs.push({ title: 'RESPONSE:', items: resp ? resp.split(/\n{2,}/).map(p => ({ v: p.trim(), own: true })) : [{ v: PH('add client response linked to each intervention'), own: true }] });

  // Plan
  it = [];
  K(it, 'Next session focus', S.t('pirpNext') || PH('next session focus'));
  K(it, 'Session frequency', S.t('freq'));
  K(it, 'Between session', S.t('pirpBetween'));
  const co = S.chips('coord').filter(x => x !== 'None'); if (co.length) K(it, 'Coordination of care', withDetail(co.join(', '), S.t('coordN')));
  if (S.seg('refInd') === 'Yes') K(it, 'Referral', S.t('refInd_d') || 'indicated');
  secs.push({ title: 'PLAN:', items: it.map(x => Object.assign(x, { own: false })) });

  // Medical necessity
  secs.push({ title: 'MEDICAL NECESSITY:', items: [{ v: S.t('medNec') || PH('medical necessity statement; write it in the Diagnostic Evaluation section'), own: true }] });

  return secs;
}

/* ───────────────────────── Rendering notes ───────────────────────── */
function layoutGroups(sec) {
  const groups = [[{ head: true, v: sec.title }]];
  let buf = [];
  const flush = () => { if (buf.length) { groups.push(buf); buf = []; } };
  sec.items.forEach(i => {
    const own = i.own != null ? i.own : (!i.k || i.v.length > 170 || i.v.includes('\n'));
    if (own) { flush(); groups.push([i]); } else buf.push(i);
  });
  flush();
  return groups;
}
function toHTML(secs, spacer) {
  return secs.map(sec => layoutGroups(sec).map(g => '<p>' + g.map(i => i.head ? '<strong>' + esc(i.v) + '</strong>' : (i.k ? '<strong>' + esc(i.k) + ':</strong> ' : '') + escBr(i.v)).join('<br>') + '</p>').join('')).join(spacer ? '<p><br></p>' : '');
}
function toText(secs) {
  return secs.map(sec => layoutGroups(sec).map(g => g.map(i => i.head ? i.v : (i.k ? i.k + ': ' : '') + i.v).join('\n')).join('\n\n')).join('\n\n');
}

/* ───────────────────────── Flags ───────────────────────── */
function intakeFlags(secs) {
  const warn = [], info = [];
  if (isLate()) warn.push('Date of service is not today. A late-entry line was added. Write the actual date written and do not backdate.');
  const a = mins(S.t('tStart')), b = mins(S.t('tEnd'));
  if (a != null && b != null && b <= a) warn.push(b === a ? 'Start and end time are the same.' : 'End time is earlier than start time; duration assumes the session crossed midnight.');
  if (S.seg('consent') !== 'Yes') warn.push('Consent reviewed is not marked Yes.');
  if (S.seg('sihi') !== 'Yes') warn.push('SI/HI reviewed is not marked Yes.');
  const si = S.seg('si'), hi = S.seg('hi');
  if (['Passive', 'Active'].includes(si) && (!S.seg('safetyPlan') || S.seg('safetyPlan') === 'Not indicated')) warn.push('SI is marked ' + si + ' and the safety plan reads "' + (S.seg('safetyPlan') || 'blank') + '". Confirm this matches your clinical judgment.');
  if (S.seg('means') === 'Access, concern' && S.seg('safetyPlan') !== 'Developed, on file') warn.push('Means access is marked "Access, concern" and no safety plan is on file.');
  if ((['Passive', 'Active'].includes(si) || ['Passive', 'Active'].includes(hi)) && !S.t('riskNarr')) warn.push('SI or HI is marked present and the risk narrative is empty.');
  if (['Passive', 'Active'].includes(hi)) warn.push('HI is marked present. Document your assessment of any identified target and your duty-to-protect analysis. That is a legal and clinical judgment; confirm with consultation or an attorney.');
  const empties = SECTIONS.filter(s => s.id !== 'pirp' && !hasData(s.card)).map(s => s.title);
  if (empties.length) info.push('Not yet filled (left out of the note): ' + empties.join('; ') + '.');
  if (!dxRows.some(r => (r.code + r.name).trim())) info.push('No diagnosis entered.');
  return { warn, info };
}
function pirpFlags() {
  const warn = [], info = [];
  if (isLate()) warn.push('Date of service is not today. A late-entry line was added. Do not backdate.');
  if (PH_LIST.length) warn.push('Bracketed placeholders to resolve before pasting: ' + PH_LIST.join('; ') + '.');
  if (!riskOn() && (['Passive', 'Active'].includes(S.seg('si')) || ['Passive', 'Active'].includes(S.seg('hi')) || ['Historical', 'Active'].includes(S.seg('nssi')))) warn.push('Risk content is recorded in the intake (SI, HI, or NSSI) and is left out of this PIRP by default. Confirm you want it documented only in the separate risk field.');
  if (S.chips('pirpAreas').includes('safety') && !riskOn()) warn.push('The SI/HI review line needs the "Include SI/HI and safety statements" option.');
  info.push('Interventions listed come only from the intake sections you filled or the boxes you checked. Confirm each against what you did before it goes in the record.');
  return { warn, info };
}
const REMIND = 'Review each section against what actually happened this session, especially the named interventions, the session length, and any bracketed placeholders, before pasting into Sessions Health. This is a draft, not a finished note or a submittable claim justification.';

/* ───────────────────────── Refresh loop ───────────────────────── */
let tab = 'intake', outputs = { intake: null, pirp: null };
const pv = $('#preview'), flagsEl = $('#flags');

function hasData(card) {
  let found = false;
  card.querySelectorAll('.fld').forEach(w => {
    if (found || w.closest('.is-hidden') || w.dataset.nocount) return;
    const ty = w.dataset.type;
    if (ty === 'static' || ty === 'readout') return;
    if (ty === 'seg') { if (w.querySelector('button[aria-checked="true"]')) found = true; }
    else if (ty === 'chips') { if (w.querySelector('input:checked') && w.dataset.fid !== 'pirpAreas') found = true; }
    else if (ty === 'custom') { if (w.dataset.fid === 'dxField' && dxRows.some(r => (r.code + r.name).trim())) found = true; }
    else { const i = w.querySelector('input,textarea,select'); if (i && i.value.trim()) found = true; }
  });
  return found;
}

function applyConds() { conds.forEach(c => c.node.classList.toggle('is-hidden', !c.fn())); }

let raf = 0;
function update() { cancelAnimationFrame(raf); raf = requestAnimationFrame(refresh); }

function refresh() {
  applyConds();
  PR = readPronouns();
  syncAreas();
  const d = calcDur(); const out = $('#durOutEl'); if (out) out.textContent = d == null ? '—' : d + ' min';
  const iSecs = buildIntake(), pSecs = buildPIRP();
  const empty = !iSecs.some(s => s.items.some(i => i.k !== 'Date of Service' && i.k !== 'CPT Code'));
  outputs.intake = { html: toHTML(iSecs), copyHtml: toHTML(iSecs, true), text: toText(iSecs), flags: intakeFlags(iSecs), empty };
  outputs.pirp = { html: toHTML(pSecs), copyHtml: toHTML(pSecs, true), text: toText(pSecs), flags: pirpFlags(), empty: false };
  renderOutput();
  SECTIONS.forEach(s => { const dot = navEl.querySelector('[data-sec="' + s.id + '"] .dot'); if (dot) dot.classList.toggle('on', hasData(s.card)); });
}

function renderOutput() {
  const o = outputs[tab];
  if (o.empty) pv.innerHTML = '<p class="empty">Start filling in the form. Your note builds here as you go.</p>';
  else pv.innerHTML = tab === 'pirp' ? o.html.replace(/\[([^\]<]+)\]/g, '<span class="ph">[$1]</span>') : o.html;
  const f = o.flags; let h = '<h3>Before you paste</h3>';
  if (f.warn.length) h += '<ul>' + f.warn.map(x => '<li class="warn">' + esc(x) + '</li>').join('') + '</ul>';
  if (f.info.length) h += '<ul>' + f.info.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  h += '<p class="remind">' + esc(REMIND) + '</p>';
  flagsEl.innerHTML = h;
}

/* Tabs */
['intake', 'pirp'].forEach(k => {
  $('#tab-' + k).addEventListener('click', () => {
    tab = k;
    ['intake', 'pirp'].forEach(x => $('#tab-' + x).setAttribute('aria-selected', x === k ? 'true' : 'false'));
    renderOutput();
  });
});

/* ───────────────────────── Copy ───────────────────────── */
const copiedEl = $('#copied');
let copiedTimer = 0;
function say(msg, bad) { copiedEl.textContent = msg; copiedEl.classList.toggle('bad', !!bad); clearTimeout(copiedTimer); copiedTimer = setTimeout(() => { copiedEl.textContent = ''; }, 3500); }
function execCopyFrom(node) {
  const r = document.createRange(); r.selectNodeContents(node);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  sel.removeAllRanges(); return ok;
}
async function copyRich() {
  const o = outputs[tab]; if (o.empty) { say('Nothing to copy yet.', true); return; }
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([o.copyHtml], { type: 'text/html' }), 'text/plain': new Blob([o.text], { type: 'text/plain' }) })]);
      say('Copied with formatting ✓'); return;
    }
  } catch (e) { /* fall through */ }
  const stage = el('div', 'copy-stage'); stage.innerHTML = o.copyHtml; document.body.append(stage);
  const okc = execCopyFrom(stage); stage.remove();
  if (okc) say('Copied with formatting ✓'); else say('The browser blocked copying. Select the preview text and press Ctrl+C.', true);
}
async function copyPlain() {
  const o = outputs[tab]; if (o.empty) { say('Nothing to copy yet.', true); return; }
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(o.text); say('Copied as plain text ✓'); return; } } catch (e) { /* fall through */ }
  const ta = document.createElement('textarea'); ta.value = o.text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove();
  if (ok) say('Copied as plain text ✓'); else say('The browser blocked copying. Select the preview text and press Ctrl+C.', true);
}
$('#copyRich').addEventListener('click', copyRich);
$('#copyPlain').addEventListener('click', copyPlain);

/* ───────────────────────── Clear all + safety net ───────────────────────── */
armButton($('#clearAll'), 'Clear all', 'Click again to clear everything', () => { clearIn(mainEl); window.scrollTo({ top: 0 }); say('Everything cleared.'); });
mainEl.addEventListener('input', update);
mainEl.addEventListener('change', update);
window.addEventListener('beforeunload', e => { if (SECTIONS.some(s => hasData(s.card))) { e.preventDefault(); e.returnValue = ''; } });

const themeBtn = $('#themeBtn');
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  themeBtn.textContent = dark ? 'Dark mode' : 'Light mode';
  themeBtn.setAttribute('aria-pressed', dark ? 'false' : 'true');
});

refresh();
})();
</script>
